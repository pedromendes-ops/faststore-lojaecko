# Wishlist backed by the installed VTEX IO app `vtex.wish-list` (GraphQL layer).
# The frontend never touches the IO app directly — these operations are proxied
# by the resolver in src/graphql/thirdParty/resolvers/wishlist.ts, which forwards
# the shopper's VtexIdclientAutCookie server-side (same BFF pattern as
# shopTheLook/textSEO). A single default list per shopper is assumed.

type WishlistItem {
  # Master Data document id of the list entry — needed to remove it.
  id: ID
  # Catalog product id (the value ProductCard matches against).
  productId: String
  sku: String
  title: String
}

type Query {
  # All items in the shopper's default wishlist. `shopperId` is the shopper's
  # profile id (or email), read from the session on the client.
  wishlist(shopperId: String!): [WishlistItem!]!
}

type Mutation {
  # Adds a product to the shopper's default wishlist. Returns the new entry id.
  addToWishlist(
    shopperId: String!
    productId: String!
    sku: String
    title: String
  ): ID
  # Removes an entry (by its WishlistItem.id) from the shopper's default wishlist.
  removeFromWishlist(shopperId: String!, id: ID!): Boolean
}
