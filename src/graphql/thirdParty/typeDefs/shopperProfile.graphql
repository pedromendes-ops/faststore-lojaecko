# Leitura autoritativa do namespace `profile` do Session Manager da VTEX.
#
# O FastStore não expõe `isAuthenticated` nem `priceTables` na sessão nativa, e
# nenhum dos dois pode ser inferido no cliente:
#
# - `person` (da ValidateSession) vem de `profile.id`, que a VTEX preenche
#   também para visitante NÃO logado que só teve o e-mail identificado
#   (`public.storeUserEmail`) — nesse caso `isAuthenticated` é "false".
# - o cookie `vtex_segment` é base64 puro (chave de cache compartilhada entre
#   usuários), então é forjável pelo shopper.
#
# O resolver (src/graphql/thirdParty/resolvers/shopperProfile.ts) consulta
# `GET /api/sessions` server-side encaminhando os cookies da requisição, no
# mesmo padrão de BFF do wishlist/shopTheLook.

type ShopperProfile {
  # `profile.isAuthenticated` — o único sinal de "está realmente logado".
  isAuthenticated: Boolean!
  # `profile.priceTables` normalizadas em minúsculas (a VTEX manda separadas
  # por vírgula quando há mais de uma).
  priceTables: [String!]!
}

type Query {
  # `null` quando o Session Manager não pôde ser consultado — estado
  # desconhecido, o cliente não deve trocar de política comercial.
  shopperProfile: ShopperProfile
}
