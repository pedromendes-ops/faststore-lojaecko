# SEO text rendered at the bottom (or elsewhere) on the PLP. Two blocks per
# category ("aboutCategory" + "textSEO") come from the account's
# `_v/search/caregories-seo?id={categoryId}` route. Consumed only through this
# resolver so the frontend never touches the API directly — same pattern as
# ShopTheLook.

type CategorySEO {
  # Short blurb shown above the product gallery.
  aboutCategory: String
  # Long-form SEO copy shown below the product gallery.
  textSEO: String
}

extend type Query {
  categorySEO(categoryId: ID!): CategorySEO!
}

# Same SEO copy, exposed straight on the collection so it can be selected in the
# server-rendered ServerCollectionPage fragment (see src/fragments). This is what
# makes the text show up in the initial HTML — indexable and visible with JS
# disabled — instead of being fetched client-side.
extend type StoreCollection {
  # Short blurb shown above the product gallery.
  aboutCategory: String
  # Long-form SEO copy shown below the product gallery.
  textSEO: String
}
