# Shop The Look — looks curated by the store, served by the account's custom
# IO route (GET /_v/search/shop-the-look). Consumed only through this resolver
# so the frontend never touches the API directly.

type ShopTheLookProduct {
  # Catalog product id (feeds useProductQuery in the modal for colors/sizes/cart).
  productId: String!
  # Default SKU (items[0].itemId).
  skuId: String!
  productName: String!
  # linkText / PDP slug.
  linkText: String!
  # Ready-to-use PDP link ("/slug/p").
  link: String!
  # Main image (items[0].images[0].imageUrl). Only one image is needed.
  image: String!
  # Current selling price (priceRange.sellingPrice.lowPrice).
  price: Float!
  # "From" price (priceRange.listPrice.highPrice).
  listPrice: Float!
}

type ShopTheLookKit {
  # Kit label ("Casual", ...) from `nameKit`.
  name: String!
  products: [ShopTheLookProduct!]!
}

type ShopTheLookCollection {
  # Section title returned by the API ("LOOKS PARA VOCÊ").
  title: String!
  kits: [ShopTheLookKit!]!
}

type Query {
  shopTheLook: [ShopTheLookCollection!]!
}
