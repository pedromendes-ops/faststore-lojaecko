extend type StoreProduct {
  productClusters: [ProductCluster!]!
  availableInstallments: [Installments!]!
}

type ProductCluster {
  id: String!
  name: String!
}

type Installments {
  installmentPaymentSystemName: String!
  installmentValue: Float!
  installmentInterest: Float!
  installmentNumber: Float!
}